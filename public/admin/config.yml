backend:
  name: git-gateway
  branch: main

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - name: "main"
        label: "Main"
        file: "src/content/site/main.md"
        fields:
          - label: "About"
            name: "about"
            widget: "text"
            hint: "Shown in the top-left About section"
          - label: "Contact Email"
            name: "contact_email"
            widget: "string"

  - name: "blog"
    label: "Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe identifier, e.g. die-krise-der-branche"
      - label: "Date"
        name: "date"
        widget: "string"
        hint: 'ISO date, e.g. "2026-01-15"'
      - label: "Category"
        name: "category"
        widget: "string"
        hint: "Display label, e.g. Strategie / Medien / Gesellschaft / Kultur"
      - label: "Group"
        name: "group"
        widget: "select"
        options:
          - label: "Sociology"
            value: "sociology"
          - label: "Marketing"
            value: "marketing"
        hint: "Drives the filter on the homepage"
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "3:2 ratio recommended"
      - label: "Selected Work"
        name: "selected"
        widget: "boolean"
        default: false
        hint: "Override: show in Selected Work nav (max 3)"
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - label: "Text"
            value: "text"
          - label: "Project"
            value: "project"
        default: "text"
        required: false
      - label: "Body"
        name: "body"
        widget: "markdown"
