backend:
  name: git-gateway
  branch: main

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "string"
        hint: 'ISO date, e.g. "2026-01-15"'
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Sociology"
          - "Marketing"
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "3:2 ratio recommended"
      - label: "Selected Work"
        name: "selected"
        widget: "boolean"
        default: false
        hint: "Show in Selected Work nav (max 3)"
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - label: "Text"
            value: "text"
          - label: "Project"
            value: "project"
        default: "text"
        required: false
      - label: "LinkedIn Post URL"
        name: "linkedin"
        widget: "string"
        required: false
      - label: "Body"
        name: "body"
        widget: "markdown"
